<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#9fd9f2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BlockyHop</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="score">0</div>
      <div id="best">Best 0</div>
    </div>

    <div id="hint">Tap to hop &middot; swipe to steer</div>

    <div id="overlay" class="hidden">
      <div id="panel">
        <h1>Game over</h1>
        <p id="overlay-cause"></p>
        <div id="numbers">
          <div><span id="overlay-score">0</span><label>Score</label></div>
          <div><span id="overlay-best">0</span><label>Best</label></div>
        </div>
        <button id="restart" type="button">Hop again</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
